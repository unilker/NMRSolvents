name: Pages

# Publishes store/web (privacy policy and support page) to
# https://unilker.github.io/NMRSolvents/. Requires Settings → Pages →
# Source: "GitHub Actions" (one-time, done in the repository settings).
on:
  push:
    branches: [main]
    paths: ['store/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: store/web
      - id: deployment
        uses: actions/deploy-pages@v5
