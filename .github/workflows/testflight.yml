name: TestFlight

# Builds a signed iOS app on a macOS runner and uploads it to App Store
# Connect (TestFlight). No Mac is needed: run it from Actions → TestFlight →
# "Run workflow", or push a tag such as v1.0.0.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   IOS_DIST_CERT_P12_BASE64         Apple Distribution certificate + key (.p12, base64)
#   IOS_DIST_CERT_PASSWORD           password of that .p12
#   IOS_PROVISIONING_PROFILE_BASE64  App Store provisioning profile for
#                                    net.kimyager.nmrimpurities (.mobileprovision, base64)
#   APP_STORE_CONNECT_KEY_ID         App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID      App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY        contents of the AuthKey_XXXX.p8 file
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  FLUTTER_VERSION: '3.47.5'

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing secrets
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=0
          for name in P12 P12_PASSWORD PROFILE KEY_ID ISSUER_ID API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install the certificate, profile and API key
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

          profile="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "Profile: $name ($uuid), team $team"
          {
            echo "PROFILE_NAME=$name"
            echo "TEAM_ID=$team"
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"

      # Signing settings go into the Runner target's xcconfig only; passing
      # them on the xcodebuild command line would also apply them to the
      # Swift package targets, which cannot take a provisioning profile.
      - name: Configure manual signing
        run: |
          cat >> ios/Flutter/Release.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF
          cat ios/Flutter/Release.xcconfig

      - name: Archive
        run: |
          flutter build ios --release --config-only --build-number=${{ github.run_number }}
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive

      - name: Export and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c 'Add :method string app-store-connect' \
            -c 'Add :destination string upload' \
            -c "Add :teamID string $TEAM_ID" \
            -c 'Add :signingStyle string manual' \
            -c 'Add :signingCertificate string Apple Distribution' \
            -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:net.kimyager.nmrimpurities string $PROFILE_NAME" \
            -c 'Add :uploadSymbols bool true' \
            -c 'Add :manageAppVersionAndBuildNumber bool false' \
            "$plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}; it appears in TestFlight after Apple finishes processing."

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
